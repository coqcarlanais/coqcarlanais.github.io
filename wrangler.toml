name = "coqcarlanais-decap-cms-oauth"
main = "src/index.ts"
compatibility_date = "2024-10-15"
compatibility_flags = ["nodejs_compat"]

# Use the *.workers.dev domain
workers_dev = true

# KV namespaces for storing OAuth data (create these in your Cloudflare dashboard first)
[[kv_namespaces]]
binding = "CODES"
id = "your-codes-namespace-id"

[[kv_namespaces]]
binding = "TOKENS"
id = "your-tokens-namespace-id"

[[kv_namespaces]]
binding = "USERS"
id = "your-users-namespace-id"

[vars]
GITHUB_CLIENT_ID = "your-github-client-id"
GITHUB_CLIENT_SECRET = "your-github-client-secret"
OAUTH_BASE_URL = "https://coqcarlanais.fr"
